[package]
name = "sonicforge-dsp"
version = "0.1.0"
edition = "2024"

[lib]
name = "sonicforge_dsp"
path = "src/lib.rs"

[[bin]]
name = "sonicforge-dsp"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
cpal = "0.18"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
